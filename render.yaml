services:
  - type: web
    name: elysia-school
    env: python
    buildCommand: ""
    startCommand: python3 main.py
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ELYSIA_ALLOW_SERVER_EXEC
        value: "0"
      - key: ELYSIA_TRUST_PROXY
        value: "1"
