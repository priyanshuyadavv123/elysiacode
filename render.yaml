services:
  - type: web
    name: elysia-school
    env: python
    buildCommand: ""
    startCommand: python3 main.py
    healthCheckPath: /api/health
    disk:
      name: elysia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ELYSIA_ALLOW_SERVER_EXEC
        value: "0"
      - key: ELYSIA_TRUST_PROXY
        value: "1"
      - key: ELYSIA_DATA_DIR
        value: /var/data
