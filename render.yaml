services:
  - type: web
    name: elysiacode
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 main.py"
    healthCheckPath: /api/health
    # Note: Disks are only available on Render Paid/Starter plans.
    # To enable persistent disk on a paid plan, uncomment the block below:
    # disk:
    #   name: elysia-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ELYSIA_ALLOW_SERVER_EXEC
        value: "0"
      - key: ELYSIA_TRUST_PROXY
        value: "1"
      - key: GROQ_API_KEY
        sync: false
